name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-release:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile ./dalamud.zip
          Expand-Archive -Path ./dalamud.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev" -Force

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --configuration Release

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Rename package
        shell: pwsh
        run: |
          Copy-Item ./EnDetailer/bin/Release/EnDetailer/latest.zip ./EnDetailer.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./EnDetailer.zip
          name: EnDetailer ${{ github.ref_name }}
          generate_release_notes: true
